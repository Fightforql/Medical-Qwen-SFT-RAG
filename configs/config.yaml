model_args:
  model_name_or_path: "Qwen/Qwen1.5-1.8B-Chat"
  use_qlora: True
  lora_rank: 64
  lora_alpha: 16
  lora_dropout: 0.1

# 数据配置
data_args:
  dataset_name: "FreedomIntelligence/HuatuoGPT-sft-data-v1" # HuggingFace数据集名称或本地数据路径
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  train_file: "train_dataset.jsonl"
  validation_file: "validation_dataset.jsonl"
  test_file: "test_dataset.jsonl"
  test_size: 0.1
  validation_size: 0.1

# 训练配置
training_args:
  output_dir: "/root/lanyun-tmp/llm_outputs/ckpt"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  num_train_epochs: 3
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  logging_steps: 2000
  save_steps: 5000
  optim: "paged_adamw_32bit"

rag_args:
  # 用于构建知识库的源文件，可以是您处理后的数据集
  knowledge_base_file: "data/processed/train_dataset.jsonl" 
  # 用于文本向量化的嵌入模型
  embedding_model: "shibing624/text2vec-base-chinese"
  # 每次检索返回的最相关文档数量
  top_k: 3
  # FAISS索引文件的保存路径
  faiss_index_path: "outputs/rag_index/huatuo.index"
  
  
inference_args:
  # 推理时使用的LoRA适配器路径
  # 'best_model' 或 'final_model' 或具体的 checkpoint 路径
  adapter_path: "best_model" 
  max_new_tokens: 1024
  temperature: 0.7
  top_p: 0.8
  use_qlora: False